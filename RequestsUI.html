<script>
  function showMyRequests() {
    setActiveMenu("menuMyRequests");

    document.getElementById("pageTitle").textContent = "My Requests";
    document.getElementById("pageSubtitle").textContent = "";

    document.getElementById("content").innerHTML = `
      <section class="requests-page">

        <div class="requests-controls-card">
          <div class="request-tabs">
            <button
              id="myActiveRequestsTab"
              class="request-tab active"
              onclick="showMyActiveRequests()">
              Active
            </button>

            <button
              id="myRequestHistoryTab"
              class="request-tab"
              onclick="showMyRequestHistory()">
              History
            </button>
          </div>

          <div class="equipment-search-wrapper requests-search-wrapper">
            <svg
              class="equipment-search-icon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2">

              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 21-4.35-4.35m1.35-5.4a6.75 6.75 0 11-13.5 0 6.75 6.75 0 0113.5 0z">
              </path>
            </svg>

            <input
              type="text"
              id="myRequestSearch"
              class="equipment-search-input"
              placeholder="Search requests..."
              oninput="renderMyRequestsView()">
          </div>
        </div>

        <div class="requests-table-card">
          <div id="requestsTable">
            Loading requests...
          </div>
        </div>

      </section>
    `;

    currentMyRequestView = "active";

    if (appCache.myRequests !== null) {
      renderMyRequestsView();
      return;
    }

    google.script.run
      .withSuccessHandler(function(requests) {
        appCache.myRequests = requests || [];
        renderMyRequestsView();
      })
      .withFailureHandler(function(error) {
        document.getElementById("requestsTable").innerHTML =
          "Error loading requests: " + error.message;

        console.error(error);
      })
      .getMyRequests(currentUser.Email);
  }

  function showMyActiveRequests() {
    currentMyRequestView = "active";
    renderMyRequestsView();
  }

  function showMyRequestHistory() {
    currentMyRequestView = "history";
    renderMyRequestsView();
  }

  function renderMyRequestsView() {
    const requests = appCache.myRequests || [];

    const activeRequests = requests.filter(request =>
      normalize(request.Status) === "pending"
    );

    const historyRequests = requests.filter(request => {
      const status = normalize(request.Status);

      return (
        status === "approved" ||
        status === "rejected"
      );
    });

    const activeTab = document.getElementById("myActiveRequestsTab");
    const historyTab = document.getElementById("myRequestHistoryTab");

    if (activeTab) {
      activeTab.textContent = `Active (${activeRequests.length})`;

      activeTab.classList.toggle(
        "active",
        currentMyRequestView === "active"
      );
    }

    if (historyTab) {
      historyTab.textContent = `History (${historyRequests.length})`;

      historyTab.classList.toggle(
        "active",
        currentMyRequestView === "history"
      );
    }

    const requestsForCurrentTab =
      currentMyRequestView === "active"
        ? activeRequests
        : historyRequests;

    const searchInput =
      document.getElementById("myRequestSearch");

    const search = normalize(
      searchInput ? searchInput.value : ""
    );

    const filteredRequests = requestsForCurrentTab.filter(request => {
      if (!search) {
        return true;
      }

      const searchableText = [
        request.Request_id,
        request.Request_type,
        formatRequestType(request.Request_type),
        request.Status,
        request.Device,
        request.Brand,
        request.Model,
        request.SN,
        request["Internal SN"],
        getRequestCommentDisplay(request),
        request.Created_at
      ]
        .map(value => String(value || ""))
        .join(" ")
        .toLowerCase();

      return searchableText.includes(search);
    });

    renderRequestsTable(
      filteredRequests,
      "requestsTable",
      false,
      false
    );
  }

  function getRequestCommentDisplay(request) {
    const comments = request.Comments || "";

    if (normalize(request.Request_type) !== "edit_equipment") {
      return comments;
    }

    try {
      const data = JSON.parse(comments);
      return data.reason || "";
    } catch (error) {
      console.error("Invalid edit request comments:", error);
      return comments;
    }
  }

  function renderRequestsTable(requests, containerId, showRequestedBy, showActions) {
    const container = document.getElementById(containerId);

    if (!requests || requests.length === 0) {
      container.innerHTML = `<p class="empty">No requests found.</p>`;
      return;
    }

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Request ID</th>
            <th>Type</th>
            ${showRequestedBy ? "<th>Requested By</th>" : ""}
            <th>Status</th>
            <th>Device</th>
            <th>Quantity</th>
            <th>Created</th>
            <th>Comments</th>
            ${showActions ? "<th>Actions</th>" : ""}
          </tr>
        </thead>
        <tbody>
          ${requests.map(request => `
            <tr>
              <td>${request.Request_id || ""}</td>
              <td>
                <span class="badge request-type-badge request-type-${String(request.Request_type || "").toLowerCase()}">
                  ${formatRequestType(request.Request_type)}
                </span>
              </td>
              ${showRequestedBy ? `<td>${request.Requested_name || ""}</td>` : ""}
              <td>
                <span class="badge request-status-badge request-status-${String(request.Status || "").toLowerCase()}">
                  ${request.Status || ""}
                </span>
              </td>
              <td>${request.Device || ""}</td>
              <td>${request.Quantity || ""}</td>
              <td>${request.Created_at || ""}</td>
              <td>${getRequestCommentDisplay(request)}</td>
              ${showActions ? `
                <td>
                  ${String(request.Status || "").toLowerCase() === "pending" ? `
                    <div class="action-buttons">

                      ${(request.Request_type === "register_equipment" || request.Request_type === "edit_equipment" ) ? `
                        <button
                          class="icon-btn btn-view"
                          title="View Details"
                          onclick="openRequestDetails('${request.Request_id}')">
                          👁
                        </button>
                      ` : ""}

                      ${request.Request_type !== "request_equipment" ? `
                        <button
                          class="icon-btn btn-approve"
                          title="Approve"
                          onclick="reviewRequestFromUI('${request.Request_id}','approve')">
                          ✓
                        </button>
                      ` : ""}

                      ${request.Request_type === "request_equipment" ? `
                        <button
                          class="icon-btn btn-assign"
                          title="Assign Equipment"
                          onclick="openAssignEquipment('${request.Request_id}')">
                          +
                        </button>
                      ` : ""}

                      <button
                        class="icon-btn btn-reject"
                        title="Reject"
                        onclick="reviewRequestFromUI('${request.Request_id}','reject')">
                        ✕
                      </button>
                                              
                    </div>
                  ` : ""}
                </td>
              ` : ""}
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  function reviewRequestFromUI(requestId, decision) {
    google.script.run
      .withSuccessHandler(function() {
        clearCache();
        showAdminRequests();
      })
      .withFailureHandler(function(error) {
        alert("Error reviewing request: " + error.message);
        console.error(error);
      })
      .reviewRequest(requestId, decision, currentUser.Email);
  }

  function showAdminRequests() {
    setActiveMenu("menuAdminRequests");

    const role = normalize(currentUser.Role);

    document.getElementById("pageTitle").textContent =
      role === "team_admin"
        ? "Team Requests"
        : "Requests";

    document.getElementById("pageSubtitle").textContent =
      role === "team_admin"
        ? "Solicitudes de tu equipo."
        : "Todas las solicitudes.";

    document.getElementById("content").innerHTML = `
      <div class="card">
        <div class="request-tabs">
          <button
            id="activeRequestsTab"
            class="request-tab active"
            onclick="showActiveRequests()">
            Active
          </button>

          <button
            id="requestHistoryTab"
            class="request-tab"
            onclick="showRequestHistory()">
            History
          </button>
        </div>

        <div class="request-filters">

          <input
            id="requestSearch"
            type="text"
            placeholder="Search requests..."
            oninput="filterVisibleRequests()">

          <select
            id="requestTypeFilter"
            onchange="filterVisibleRequests()">

            <option value="">All Types</option>
            <option value="request_equipment">Request Equipment</option>
            <option value="register_equipment">Register Equipment</option>
            <option value="damaged_equipment">Damaged Equipment</option>
            <option value="return_equipment">Return Equipment</option>
            <option value="edit_equipment">Edit Equipment</option>

          </select>

          <select
            id="requestStatusFilter"
            onchange="filterVisibleRequests()">

            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>

          </select>

        </div>

        <div id="requestResultsCount" class="request-results-count"></div>
        <div id="adminRequestsTable">
          Loading requests...
        </div>
      </div>
    `;

    if (appCache.adminRequests !== null) {
      currentRequests = appCache.adminRequests;
      currentRequestView = "active";
      renderAdminRequestsView();
      return;
    }

    google.script.run
      .withSuccessHandler(function(requests) {

        appCache.adminRequests = requests || [];

        currentRequests = appCache.adminRequests;
        currentRequestView = "active";

        renderAdminRequestsView();

      })
      .withFailureHandler(function(error) {

        document.getElementById("adminRequestsTable").innerHTML =
          "Error loading requests: " + error.message;

        console.error(error);

      })
      .getVisibleRequests(currentUser.Email);
  }

  function showActiveRequests() {
    currentRequestView = "active";
    renderAdminRequestsView();
  }

  function showRequestHistory() {
    currentRequestView = "history";
    renderAdminRequestsView();
  }

  function renderAdminRequestsView() {
    const activeTab = document.getElementById("activeRequestsTab");
    const historyTab = document.getElementById("requestHistoryTab");

    if (activeTab && historyTab) {
      activeTab.classList.toggle(
        "active",
        currentRequestView === "active"
      );

      historyTab.classList.toggle(
        "active",
        currentRequestView === "history"
      );
    }
    filterVisibleRequests();
  }

  function filterVisibleRequests() {
    const search = normalize(
        document.getElementById("requestSearch").value
    );
    const type = normalize(
        document.getElementById("requestTypeFilter").value
    );
    const statusFilter = normalize(
        document.getElementById("requestStatusFilter").value
    );       
    const filtered = currentRequests.filter(request => {
        const status = normalize(request.Status);

        // Primero filtra por la pestaña
        if (
            currentRequestView === "active" &&
            status !== "pending"
        ){
            return false;
        }

        if (
            currentRequestView === "history" &&
            status !== "approved" &&
            status !== "rejected"
        ){
            return false;
        }

        // Luego aplica búsqueda
        const text = [
            request.Request_id,
            request.Request_type,
            request.Requested_name,
            request.Device,
            request.Brand,
            request.Model,
            request.SN,
            request.Comments
        ]
        .join(" ")
        .toLowerCase();

        if (search && !text.includes(search))
            return false;

        if (
            type &&
            String(request.Request_type || "").toLowerCase() !== type
        )
            return false;

        if (
            statusFilter &&
            status !== statusFilter
        )
            return false;
        return true;
    });

    const countElement = document.getElementById("requestResultsCount");

    if (countElement) {
      countElement.textContent =
        `Showing ${filtered.length} of ${currentRequests.length} requests`;
    }

    renderRequestsTable(
        filtered,
        "adminRequestsTable",
        true,
        currentRequestView === "active"
    );
  }

  function openRequestForm(type) {
    currentRequestType = type;

    const modal = document.getElementById("requestModal");
    const title = document.getElementById("requestTitle");
    const form = document.getElementById("requestForm");

    if (!modal || !title || !form) {
      console.error("Request modal elements were not found.");
      return;
    }

    const deviceOptions = DEVICE_TYPES.map(device =>
      `<option value="${device}">${device}</option>`
    ).join("");

    if (type === "request_equipment") {
      title.textContent = "Request Equipment";

      form.innerHTML = `
        <label>Device Type *</label>

        <select
          id="requestDevice"
          style="
            width:100%;
            padding:12px;
            margin-top:8px;
            border:1px solid #d0d5dd;
            border-radius:10px;
          ">
          ${deviceOptions}
        </select>

        <label style="display:block; margin-top:18px;">
          Quantity *
        </label>

        <select
          id="requestQuantity"
          style="
            width:100%;
            padding:12px;
            margin-top:8px;
            border:1px solid #d0d5dd;
            border-radius:10px;
          ">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>

        <input
          id="requestComments"
          placeholder="Comments">
      `;
    }

    if (type === "register_equipment") {
      title.textContent = "Register Equipment";

      form.innerHTML = `
        <label>Device Type *</label>

        <select
          id="requestDevice"
          style="
            width:100%;
            padding:12px;
            margin-top:8px;
            border:1px solid #d0d5dd;
            border-radius:10px;
          ">
          ${deviceOptions}
        </select>

        <input id="requestBrand" placeholder="Brand">
        <input id="requestModel" placeholder="Model">
        <input id="requestSN" placeholder="Serial Number">
        <input id="requestInternalSN" placeholder="Internal SN">
        <input id="requestComments" placeholder="Comments">
      `;
    }

    if (type === "damaged_equipment") {
      title.textContent = "Report Damaged Equipment";

      form.innerHTML = `
        <label>Equipment *</label>

        <select
          id="requestDevice"
          style="
            width:100%;
            padding:12px;
            margin-top:8px;
            border:1px solid #d0d5dd;
            border-radius:10px;
          ">
          ${getMyEquipmentOptions()}
        </select>

        <input
          id="requestComments"
          placeholder="Comments">
      `;
    }

    if (type === "return_equipment") {
      title.textContent = "Return Equipment";

      form.innerHTML = `
        <label>Equipment *</label>

        <select
          id="requestDevice"
          style="
            width:100%;
            padding:12px;
            margin-top:8px;
            border:1px solid #d0d5dd;
            border-radius:10px;
          ">
          ${getMyEquipmentOptions()}
        </select>

        <input
          id="requestComments"
          placeholder="Comments">
      `;
    }

    modal.style.display = "block";
  }  

  function openRequestDetails(requestId) {
    const request = currentRequests.find(item =>
      String(item.Request_id || "").trim() ===
      String(requestId || "").trim()
    );

    if (!request) {
      alert("Request not found.");
      return;
    }

    const modal = document.getElementById("requestDetailsModal");
    const content = document.getElementById("requestDetailsContent");

    if (!modal || !content) {
      alert("Request details modal was not found.");
      return;
    }

    if (normalize(request.Request_type) === "edit_equipment") {
      let editData = {
        reason: "",
        updated: {}
      };

      try {
        editData = JSON.parse(request.Comments || "{}");
      } catch (error) {
        console.error("Invalid edit request JSON:", error);
      }

      const updated = editData.updated || {};

      const fields = [
        {
          label: "Device",
          current: request.Device || "",
          requested: updated.Device || ""
        },
        {
          label: "Brand",
          current: request.Brand || "",
          requested: updated.Brand || ""
        },
        {
          label: "Model",
          current: request.Model || "",
          requested: updated.Model || ""
        },
        {
          label: "Serial Number",
          current: request.SN || "",
          requested: updated.SN || ""
        },
        {
          label: "Internal SN",
          current: request["Internal SN"] || "",
          requested: updated["Internal SN"] || ""
        }
      ];

      const changedFields = fields.filter(field =>
        String(field.current || "").trim() !==
        String(field.requested || "").trim()
      );

      const changeCount = changedFields.length;

      const assetIdentifier =
        request["Internal SN"] ||
        request.SN ||
        "No identifier";

      content.innerHTML = `
        <div style="
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          gap:20px;
          margin-bottom:24px;
        ">
          <div>
            <div style="
              font-size:13px;
              color:#667085;
              margin-bottom:4px;
            ">
              Asset
            </div>

            <div style="
              font-size:20px;
              font-weight:700;
              color:#101828;
            ">
              ${request.Device || "Asset"}
            </div>

            <div style="
              margin-top:4px;
              color:#475467;
            ">
              ${request.Brand || ""} ${request.Model || ""}
            </div>

            <div style="
              margin-top:4px;
              font-size:13px;
              color:#667085;
            ">
              Identifier: ${assetIdentifier}
            </div>
          </div>

          <span style="
            padding:6px 10px;
            border-radius:999px;
            background:#fff7e6;
            color:#b54708;
            border:1px solid #fedf89;
            font-size:13px;
            font-weight:600;
            text-transform:capitalize;
          ">
            ${request.Status || ""}
          </span>
        </div>

        <div style="
          display:grid;
          grid-template-columns:140px 1fr;
          gap:10px 18px;
          padding:18px 0;
          border-top:1px solid #eaecf0;
          border-bottom:1px solid #eaecf0;
          margin-bottom:24px;
        ">
          <strong>Request ID</strong>
          <span>${request.Request_id || ""}</span>

          <strong>Requested By</strong>
          <span>${request.Requested_name || ""}</span>

          <strong>Team</strong>
          <span>${request.Team || ""}</span>

          <strong>Created</strong>
          <span>${request.Created_at || ""}</span>

          <strong>Reason for Change</strong>
          <span>${editData.reason || "No reason provided."}</span>
        </div>

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-bottom:12px;
        ">
          <h3 style="
            margin:0;
            color:#101828;
          ">
            Proposed Changes
          </h3>

          <span style="
            font-size:13px;
            color:#667085;
          ">
            ${changeCount}
            field${changeCount !== 1 ? "s" : ""} modified
          </span>
        </div>

        ${
          changeCount === 0
            ? `
              <div style="
                padding:16px;
                border:1px solid #eaecf0;
                border-radius:10px;
                color:#667085;
                text-align:center;
              ">
                No changes were requested.
              </div>
            `
            : `
              <div style="
                border:1px solid #eaecf0;
                border-radius:12px;
                overflow:hidden;
                width:100%;
              ">
                <div style="
                  display:grid;
                  grid-template-columns:32% 34% 34%;
                  background:#f9fafb;
                  border-bottom:1px solid #eaecf0;
                ">
                  <div style="
                    padding:12px 16px;
                    font-size:13px;
                    font-weight:600;
                    color:#475467;
                  ">
                    Field
                  </div>

                  <div style="
                    padding:12px 16px;
                    font-size:13px;
                    font-weight:600;
                    color:#475467;
                  ">
                    Current
                  </div>

                  <div style="
                    padding:12px 16px;
                    font-size:13px;
                    font-weight:600;
                    color:#475467;
                  ">
                    Proposed
                  </div>
                </div>

                ${changedFields.map((field, index) => `
                  <div style="
                    display:grid;
                    grid-template-columns:32% 34% 34%;
                    ${index < changedFields.length - 1
                      ? "border-bottom:1px solid #eaecf0;"
                      : ""
                    }
                  ">
                    <div style="
                      padding:14px 16px;
                      font-weight:600;
                      color:#101828;
                      overflow-wrap:anywhere;
                      word-break:break-word;
                    ">
                      ${field.label}
                    </div>

                    <div style="
                      padding:14px 16px;
                      color:#475467;
                      overflow-wrap:anywhere;
                      word-break:break-word;
                    ">
                      ${field.current || "—"}
                    </div>

                    <div style="
                      padding:14px 16px;
                      color:#027a48;
                      font-weight:600;
                      background:#ecfdf3;
                      overflow-wrap:anywhere;
                      word-break:break-word;
                    ">
                      ${field.requested || "—"}
                    </div>
                  </div>
                `).join("")}
              </div>
            `
        }
      `;

      modal.style.display = "flex";
      return;
    }

    content.innerHTML = `
      <div style="
        display:grid;
        grid-template-columns:140px 1fr;
        gap:12px 18px;
      ">
        <strong>Request ID</strong>
        <span>${request.Request_id || ""}</span>

        <strong>Type</strong>
        <span>${formatRequestType(request.Request_type)}</span>

        <strong>Requested By</strong>
        <span>${request.Requested_name || ""}</span>

        <strong>Team</strong>
        <span>${request.Team || ""}</span>

        <strong>Status</strong>
        <span>${request.Status || ""}</span>

        <strong>Device</strong>
        <span>${request.Device || ""}</span>

        <strong>Brand</strong>
        <span>${request.Brand || ""}</span>

        <strong>Model</strong>
        <span>${request.Model || ""}</span>

        <strong>SN</strong>
        <span>${request.SN || ""}</span>

        <strong>Internal SN</strong>
        <span>${request["Internal SN"] || ""}</span>

        <strong>Quantity</strong>
        <span>${request.Quantity || ""}</span>

        <strong>Created</strong>
        <span>${request.Created_at || ""}</span>

        <strong>Reviewed By</strong>
        <span>${request.Reviewed_by || ""}</span>

        <strong>Reviewed At</strong>
        <span>${request.Reviewed_at || ""}</span>

        <strong>Comments</strong>
        <span>${request.Comments || ""}</span>
      </div>
    `;

    modal.style.display = "flex";
  }

  function getMyEquipmentOptions() {
    if (!currentData || currentData.length === 0) {
      return `<option value="">No equipment found</option>`;
    }

    return currentData.map(item => {
      const device = item.Device || "";
      const sn = item.SN || "";
      const internalSN = item["Internal SN"] || "";

      const label = `${device} | ${item.Brand || ""} ${item.Model || ""} | ${internalSN || sn || ""}`;
      const brand = item.Brand || "";
      const model = item.Model || "";

      const value = `${device}||${brand}||${model}||${sn}||${internalSN}`;

      return `<option value="${value}">${label}</option>`;
    }).join("");
  }

  function submitRequest() {
    let selectedDevice = document.getElementById("requestDevice")?.value || "";
    let selectedBrand = "";
    let selectedModel = "";
    let selectedSN = "";
    let selectedInternalSN = "";

    if (selectedDevice.includes("||")) {
      const parts = selectedDevice.split("||");

      selectedDevice = parts[0] || "";
      selectedBrand = parts[1] || "";
      selectedModel = parts[2] || "";
      selectedSN = parts[3] || "";
      selectedInternalSN = parts[4] || "";
    }

    const request = {
      Request_type: currentRequestType,
      Requested_by: currentUser.Email,
      Requested_name: currentUser.Name,
      Team: currentUser.Team,
      Device: selectedDevice,
      Brand: selectedBrand || document.getElementById("requestBrand")?.value || "",
      Model: selectedModel || document.getElementById("requestModel")?.value || "",
      SN: selectedSN || document.getElementById("requestSN")?.value || "",
      "Internal SN": selectedInternalSN || document.getElementById("requestInternalSN")?.value || "",
      Quantity: document.getElementById("requestQuantity")?.value || 1,
      Comments: document.getElementById("requestComments")?.value || ""
    };

    google.script.run
      .withSuccessHandler(function() {
        closeRequestForm();
        clearCache();
        document.getElementById("successModal").style.display = "flex";

        setTimeout(function() {
          document.getElementById("successModal").style.display = "none";
        }, 1600);
      })

      .withFailureHandler(function(error) {
        document.getElementById("requestForm").innerHTML = `<p style="color:#b91c1c; font-weight:bold;">Error submitting request: ${error.message}</p>`;
        console.error(error);
      })
      .createRequest(request);
  }

  function closeRequestForm() {
    document.getElementById("requestModal").style.display = "none";
  }

  function openAssignEquipment(requestId) {
    const request = currentRequests.find(r =>
      String(r.Request_id || "").trim() === String(requestId || "").trim()
    );

    if (!request) {
      alert("Request not found.");
      return;
    }

    currentAssignRequest = request;
    const modal = document.getElementById("assignModal");
    const content = document.getElementById("assignModalContent");

    modal.style.display = "flex";
    content.innerHTML = `<p>Loading available equipment...</p>`;

    google.script.run
      .withSuccessHandler(function(assets) {
        const availableAssets = assets || [];
        currentAvailableAssets = availableAssets;

        if (availableAssets.length === 0) {
          content.innerHTML = `
            <div class="assign-count">0 available</div>
            <p>No available ${request.Device} equipment was found.</p>
          `;
          return;
        }
        const quantityNeeded = Number(request.Quantity || 1);

        if (availableAssets.length < quantityNeeded) {
          content.innerHTML = `
            <div class="assign-count">
              ${availableAssets.length} available
            </div>

            <p style="color:#b91c1c; font-weight:bold;">
              This request needs ${quantityNeeded} equipment(s), but only
              ${availableAssets.length} are available.
            </p>
          `;
          return;
        }

        content.innerHTML = `
          <div class="assign-count">
            ${availableAssets.length} available
          </div>

          <p>
            Select exactly
            <strong>${quantityNeeded}</strong>
            equipment(s) to assign to:
            <strong>${request.Requested_name}</strong>
          </p>

          <div class="available-assets-list">
            ${availableAssets.map((asset, index) => {
              const identifier =
                asset["Internal SN"] ||
                asset.SN ||
                "No identifier";

              return `
                <label class="available-asset-option">
                  <input
                    type="checkbox"
                    class="selected-asset-checkbox"
                    value="${index}">

                  <div>
                    <strong>${asset.Device || ""}</strong><br>
                    <span>
                      ${asset.Brand || ""} ${asset.Model || ""}
                    </span><br>
                    <small>${identifier}</small>
                  </div>
                </label>
              `;
            }).join("")}
          </div>

          <button class="button" style="margin-top:18px;"
            onclick="confirmAssetSelection()">
            Assign ${quantityNeeded} Equipment
          </button>
        `;
      })
      .withFailureHandler(function(error) {
        content.innerHTML = `
          <p style="color:#b91c1c;">
            ${error.message}
          </p>
        `;
      })
      .getAvailableAssetsByDevice(request.Device);
  }

  function closeAssignModal() {
    document.getElementById("assignModal").style.display = "none";
  }

  function confirmAssetSelection() {
    const quantityNeeded = Number(
      currentAssignRequest.Quantity || 1
    );

    const selectedInputs = Array.from(
      document.querySelectorAll(
        ".selected-asset-checkbox:checked"
      )
    );

    if (selectedInputs.length !== quantityNeeded) {
      alert(
        "Please select exactly " +
        quantityNeeded +
        " equipment(s)."
      );
      return;
    }

    const selectedAssets = selectedInputs.map(input =>
      currentAvailableAssets[Number(input.value)]
    );

    const content = document.getElementById(
      "assignModalContent"
    );

    content.innerHTML = `
      <p>Assigning ${selectedAssets.length} equipment(s)...</p>
    `;

    assignAssetsOneByOne(selectedAssets, 0);
  }

  function assignAssetsOneByOne(selectedAssets, currentIndex) {
    if (currentIndex >= selectedAssets.length) {
      approveRequestAfterAssignment();
      return;
    }

    const asset = selectedAssets[currentIndex];

    google.script.run
      .withSuccessHandler(function() {
        assignAssetsOneByOne(
          selectedAssets,
          currentIndex + 1
        );
      })
      .withFailureHandler(function(error) {
        alert(
          "Error assigning equipment " +
          (currentIndex + 1) +
          ": " +
          error.message
        );

        console.error(error);
      })
      .assignSelectedAssetToUser(
        asset,
        currentAssignRequest.Requested_name,
        currentAssignRequest.Team
      );
  }

  function approveRequestAfterAssignment() {
    google.script.run
      .withSuccessHandler(function() {
        clearCache();
        closeAssignModal();

        document.getElementById(
          "successModal"
        ).style.display = "flex";

        setTimeout(function() {
          document.getElementById(
            "successModal"
          ).style.display = "none";
        }, 1600);

        showAdminRequests();
      })
      .withFailureHandler(function(error) {
        alert(
          "The equipment was assigned, but the request " +
          "could not be approved: " +
          error.message
        );

        console.error(error);
      })
      .approveAssignedRequest(
        currentAssignRequest.Request_id,
        currentUser.Email
      );
  }

  function closeRequestDetails() {
    document.getElementById("requestDetailsModal").style.display = "none";
  }
</script>
