<script>
  //INVENTORY  
  function showMyInventory() {
    setActiveMenu("menuMyInventory");

    document.getElementById("pageTitle").textContent = "My Inventory";
    document.getElementById("pageSubtitle").textContent = "";

    document.getElementById("content").innerHTML = `
      <section class="inventory-page">

        <div class="quick-actions-section">
          <h2 class="section-title">Quick Actions</h2>

          <div class="quick-actions-grid">

            <button
              type="button"
              class="quick-action-card"
              onclick="openRequestForm('request_equipment')">

              <div class="quick-action-icon icon-request">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="1.8">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.25 3h1.386c.51 0 .955.343 1.087.835L5.1 5.25m0 0h14.4l-1.5 9H7.35m-2.25-9 2.25 9m0 0-1.125 2.25M7.35 14.25h10.65m-10.65 0L6.225 16.5m0 0h12.525M9 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm9 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z">
                  </path>
                </svg>
              </div>

              <div class="quick-action-content">
                <div class="quick-action-title">
                  Request Equipment
                </div>

                <div class="quick-action-description">
                  Request a new device
                </div>
              </div>
            </button>

            <button
              type="button"
              class="quick-action-card"
              onclick="openRequestForm('register_equipment')">

              <div class="quick-action-icon icon-register">
                  <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2">

                      <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M12 5v14M5 12h14">
                      </path>
                  </svg>
              </div>

              <div class="quick-action-content">
                <div class="quick-action-title">
                  Register Equipment
                </div>

                <div class="quick-action-description">
                  Add new equipment
                </div>
              </div>
            </button>

            <button
              type="button"
              class="quick-action-card"
              onclick="openRequestForm('damaged_equipment')">

              <div class="quick-action-icon icon-damage">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="1.8">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 9v4m0 4h.01M10.3 3.84 2.82 17.25a2 2 0 001.75 3h14.86a2 2 0 001.75-3L13.7 3.84a2 2 0 00-3.4 0z">
                  </path>
                </svg>
              </div>

              <div class="quick-action-content">
                <div class="quick-action-title">
                  Report Damaged Equipment
                </div>

                <div class="quick-action-description">
                  Report an equipment issue
                </div>
              </div>
            </button>

            <button
              type="button"
              class="quick-action-card"
              onclick="openRequestForm('return_equipment')">

              <div class="quick-action-icon icon-return">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="1.8">

                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 14l-4-4m0 0 4-4m-4 4h11a4 4 0 010 8h-1">
                  </path>
                </svg>
              </div>

              <div class="quick-action-content">
                <div class="quick-action-title">
                  Return Equipment
                </div>

                <div class="quick-action-description">
                  Return an assigned device
                </div>
              </div>
            </button>

          </div>
        </div>

        <div class="equipment-section">
          <div class="equipment-section-header">
            <h2 class="section-title">Equipment</h2>
          </div>

          <div class="equipment-search-wrapper">
            <svg
              class="equipment-search-icon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 21-4.35-4.35m1.35-5.4a6.75 6.75 0 11-13.5 0 6.75 6.75 0 0113.5 0z">
              </path>
            </svg>

            <input
              type="text"
              id="searchInput"
              class="equipment-search-input"
              placeholder="Search equipment..."
              oninput="filterTable()">
          </div>

          <div
            id="tableArea"
            class="empty">
            Loading equipment...
          </div>
        </div>

      </section>
    `;

    if (appCache.myInventory !== null) {
      currentData = appCache.myInventory;
      renderTable(currentData);
      return;
    }

    google.script.run
      .withSuccessHandler(function(data) {
        appCache.myInventory = data || [];
        currentData = appCache.myInventory;
        renderTable(currentData);
      })
      .withFailureHandler(function(error) {
        document.getElementById("tableArea").innerHTML =
          "Error loading inventory: " + error.message;

        console.error(error);
      })
      .getMyInventory(currentUser.Email);
  }

  function showAdminInventory() {
    setActiveMenu("menuAdminInventory");

    const role = normalize(currentUser.Role);

    if (role === "team_admin") {
      document.getElementById("pageTitle").textContent = "Team Inventory";
      document.getElementById("pageSubtitle").textContent = "Inventario de tu equipo.";
    } else {
      document.getElementById("pageTitle").textContent = "Inventory";
      document.getElementById("pageSubtitle").textContent = "Inventario general de equipos.";
    }

    document.getElementById("content").innerHTML = `
      <div class="card">
        <h2>${role === "team_admin" ? "Team Inventory Overview" : "Inventory Overview"}</h2>
        <div id="inventorySummary"></div>
      </div>

      <div class="card" id="inventoryTableCard" style="display:none;">
        <h2 id="inventoryTableTitle">Available Equipment</h2>

        <input
          type="text"
          id="searchInput"
          placeholder="Search available equipment..."
          oninput="filterTable()">

        <div id="tableArea"></div>
      </div>
    `;

    if (appCache.adminInventory !== null) {
      currentData = appCache.adminInventory;
      renderInventorySummary(currentData);
      return;
    }

    const successHandler = function(data) {
      appCache.adminInventory = data || [];
      currentData = appCache.adminInventory;

      renderInventorySummary(currentData);
    };

    const failureHandler = function(error) {
      document.getElementById("tableArea").innerHTML =
        "Error cargando inventario: " + error.message;

      console.error(error);
    };

    if (role === "team_admin") {
      google.script.run
        .withSuccessHandler(successHandler)
        .withFailureHandler(failureHandler)
        .getTeamInventory(currentUser.Email);
    } else {
      google.script.run
        .withSuccessHandler(successHandler)
        .withFailureHandler(failureHandler)
        .getAllInventory(currentUser.Email);
    }
  }

  function openAdminInventory() {
    const role = normalize(currentUser.Role);

    if (role === "team_admin") {
      showTeamInventory();
    } else {
      showAdminInventory();
    }

  }

  function renderInventorySummary(data) {
    const container = document.getElementById("inventorySummary");

    if (!container) {
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = `
        <p class="empty">No inventory data available.</p>
      `;
      return;
    }

    const summary = {};

    let totalAssets = 0;
    let totalAvailable = 0;
    let totalDamaged = 0;

    data.forEach(asset => {
      const device =
        String(asset.Device || "Other").trim() || "Other";

      const assignee = normalize(asset.Assignee);

      totalAssets += 1;

      if (assignee === "available") {
        totalAvailable += 1;
      }

      if (assignee === "damaged") {
        totalDamaged += 1;
      }

      if (!summary[device]) {
        summary[device] = {
          total: 0,
          available: 0
        };
      }

      summary[device].total += 1;

      if (assignee === "available") {
        summary[device].available += 1;
      }
    });

    const deviceCards = Object.entries(summary)
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([device, counts]) => `
        <button
          class="device-summary-card"
          onclick="filterInventoryByDevice('${device.replace(/'/g, "\\'")}')">

          <div class="device-summary-name">
            ${getDeviceIcon(device)}
            <span>${device}</span>
          </div>

          <div class="device-summary-total">
            ${counts.total}
            <span class="device-summary-label">Total</span>
          </div>

          <div class="device-summary-available">
            ${counts.available} available
          </div>
        </button>
      `)
      .join("");

    container.innerHTML = `
      <div class="inventory-main-stats">
        <div class="inventory-main-stat">
          <div class="inventory-main-number">
            ${totalAssets}
          </div>

          <div class="inventory-main-label">
            Total Assets
          </div>
        </div>

        <div class="inventory-main-stat">
          <div class="inventory-main-number">
            ${totalAvailable}
          </div>

          <div class="inventory-main-label">
            Available
          </div>
        </div>

        <div class="inventory-main-stat">
          <div class="inventory-main-number">
            ${totalDamaged}
          </div>

          <div class="inventory-main-label">
            Damaged
          </div>
        </div>
      </div>

      <div class="inventory-device-grid">
        ${deviceCards}
      </div>
    `;
  }

  function filterInventoryByDevice(device) {
    const normalizedDevice = normalize(device);

    const fullInventory = appCache.adminInventory || [];

    const filteredData = fullInventory.filter(asset => {
      const assetDevice = normalize(asset.Device);

      const assignee = normalize(asset.Assignee);

      return (
        assetDevice === normalizedDevice &&
        assignee === "available"
      );
    });

    // La búsqueda posterior también se limita a estos disponibles.
    currentData = filteredData;

    const tableCard = document.getElementById("inventoryTableCard");
    const tableTitle = document.getElementById("inventoryTableTitle");
    const searchInput = document.getElementById("searchInput");

    if (tableCard) {
      tableCard.style.display = "block";
    }

    if (tableTitle) {
      tableTitle.textContent = `${device} — Available`;
    }

    if (searchInput) {
      searchInput.value = "";
      searchInput.placeholder = `Search available ${device}...`;
    }

    inventoryAssignmentMode = true;

    renderTable(filteredData);

    if (tableCard) {
      tableCard.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }
  }

  function renderTable(data) {
    const tableArea = document.getElementById("tableArea");

    if (!tableArea) {
      return;
    }

    if (!data || data.length === 0) {
      tableArea.innerHTML = `
        <p class="empty">No se encontraron equipos.</p>
      `;
      return;
    }

    const isMyInventory = !inventoryAssignmentMode;

    tableArea.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Device</th>
            <th>Brand</th>
            <th>Model</th>
            <th>SN</th>
            <th>Team</th>
            <th>Internal SN</th>

            ${
              isMyInventory
                ? '<th style="width:70px; text-align:center;">Actions</th>'
                : `
                  <th>Assignee</th>
                  <th>Labeled</th>
                  <th style="width:70px;">Assign</th>
                `
            }
          </tr>
        </thead>

        <tbody>
          ${data.map(item => {
            const assignee =
              item.Assignee || "Available";

            const badgeClass =
              normalize(assignee) === "available"
                ? "available"
                : "assigned";

            return `
              <tr>
                <td>${item.Device || ""}</td>
                <td>${item.Brand || ""}</td>
                <td>${item.Model || ""}</td>
                <td>${item.SN || ""}</td>
                <td>${item.Team || ""}</td>
                <td>${item["Internal SN"] || ""}</td>

                ${
                  isMyInventory
                    ? `
                      <td style="text-align:center;">
                        <button
                          class="user-card-icon-btn edit-asset-icon"
                          title="Request Asset Update"
                          aria-label="Request Asset Update"
                          onclick='openEditAssetRequest(${JSON.stringify(item)})'>

                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2">

                            <path
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M16.862 3.487a2.1 2.1 0 113 2.97L8.25 18.07 4 19l.93-4.25L16.862 3.487z">
                            </path>
                          </svg>
                        </button>
                      </td>
                    `
                    : `
                      <td>
                        <span class="badge ${badgeClass}">
                          ${assignee}
                        </span>
                      </td>

                      <td>${item.Labeled || ""}</td>

                      <td>
                        <button
                          class="assign-user-button"
                          title="Assign Equipment"
                          onclick='openDirectAssignModal(${JSON.stringify(item)})'>
                          👤⁺
                        </button>
                      </td>
                    `
                }
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    `;
  }

  function filterTable() {
    const searchInput = document.getElementById("searchInput");
    if (!searchInput) return;

    const search = normalize(searchInput.value);

    const filtered = currentData.filter(item =>
      Object.values(item).some(value => normalize(value).includes(search))
    );

    renderTable(filtered);
  }

  //DIRECTO ASSIGN
  function openDirectAssignModal(asset) {
    currentDirectAssignAsset = asset;

    const modal = document.getElementById("directAssignModal");
    const content = document.getElementById("directAssignContent");

    if (!modal || !content) {
      console.error("Direct assignment modal was not found.");
      return;
    }

    const identifier =
      asset["Internal SN"] ||
      asset.SN ||
      "No identifier";

    content.innerHTML = `
      <div class="available-asset-option">
        <div>
          <strong>${asset.Device || "Equipment"}</strong>

          <div class="team-item-meta">
            ${asset.Brand || ""} ${asset.Model || ""}
          </div>

          <div class="team-item-meta">
            SN: ${asset.SN || "No serial number"}
          </div>

          <div class="team-item-meta">
            Internal SN: ${asset["Internal SN"] || "No internal SN"}
          </div>

          <div class="team-item-meta">
            Identifier: ${identifier}
          </div>
        </div>
      </div>

      <div style="margin-top:20px;">
        <label style="font-weight:600;">
          Assign to
        </label>

        <input
          type="text"
          id="assignUserSearch"
          placeholder="Search by name, email, or team..."
          oninput="filterAssignUsers()"
          style="
            width:100%;
            padding:12px;
            margin-top:12px;
            border:1px solid #d0d5dd;
            border-radius:10px;
            font-size:14px;
            box-sizing:border-box;
          ">

        <div
          id="assignUsersList"
          style="
            margin-top:10px;
            max-height:220px;
            overflow-y:auto;
            border:1px solid #e5e7eb;
            border-radius:12px;
            background:white;
          ">
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:22px;">
        <button
          class="button"
          style="background:#667085;"
          onclick="closeDirectAssignModal()">
          Cancel
        </button>

        <button
          id="directAssignButton"
          class="button"
          disabled
          onclick="confirmDirectAssignment()"
          style="opacity:.5; cursor:not-allowed;">
          Assign
        </button>
      </div>
    `;
    google.script.run
      .withSuccessHandler(function(users) {
        availableUsers = users || [];
        renderAssignUsersList(availableUsers);;
      })
      .getVisibleUsers(currentUser.Email);
    modal.style.display = "flex";
  }

  function closeDirectAssignModal() {
    document.getElementById("directAssignModal").style.display = "none";

    currentDirectAssignAsset = null;
    selectedDirectAssignUser = null;
  }

  function renderAssignUsersList(users) {
    const container = document.getElementById("assignUsersList");

    if (!container) {
      return;
    }

    if (!users || users.length === 0) {
      container.innerHTML = `
        <div style="padding:14px; color:#667085;">
          No users found.
        </div>
      `;
      return;
    }

    container.innerHTML = users.map(user => {
      const isSelected =
        selectedDirectAssignUser &&
        String(selectedDirectAssignUser.Email || "") ===
        String(user.Email || "");

      return `
        <div
          class="assign-user-row"
          onclick='selectDirectAssignUser(${JSON.stringify(user)})'
          style="
            ${isSelected
              ? "background:#eef4ff; border-color:#2563eb;"
              : ""}
          ">

          <div style="font-weight:600; color:#172033;">
            ${user.Name || "Unnamed user"}
          </div>

          <div style="font-size:13px; color:#667085; margin-top:3px;">
            ${user.Email || ""}
          </div>

          <div style="font-size:12px; color:#98a2b3; margin-top:3px;">
            ${user.Team || "No team"}
          </div>
        </div>
      `;
    }).join("");
  }

  function filterAssignUsers() {
    const input = document.getElementById("assignUserSearch");

    if (!input) {
      return;
    }

    const search = normalize(input.value);

    const filteredUsers = availableUsers.filter(user => {
      const name = normalize(user.Name);
      const email = normalize(user.Email);
      const team = normalize(user.Team);

      return (
        name.includes(search) ||
        email.includes(search) ||
        team.includes(search)
      );
    });

    renderAssignUsersList(filteredUsers);
  }

  function selectDirectAssignUser(user) {
    selectedDirectAssignUser = user;

    const searchInput = document.getElementById("assignUserSearch");
    const assignButton = document.getElementById("directAssignButton");

    if (searchInput) {
      searchInput.value = user.Name || user.Email || "";
    }

    if (assignButton) {
      assignButton.disabled = false;
      assignButton.style.opacity = "1";
      assignButton.style.cursor = "pointer";
    }

    renderAssignUsersList([user]);
  }

  function confirmDirectAssignment() {
    if (!currentDirectAssignAsset || !selectedDirectAssignUser) {
      alert("Please select an asset and a user.");
      return;
    }

    const assignButton = document.getElementById("directAssignButton");

    if (assignButton) {
      assignButton.disabled = true;
      assignButton.textContent = "Assigning...";
      assignButton.style.opacity = ".5";
      assignButton.style.cursor = "not-allowed";
    }

    google.script.run
      .withSuccessHandler(function() {
        closeDirectAssignModal();
        clearCache();

        document.getElementById("successModal").style.display = "flex";

        setTimeout(function() {
          document.getElementById("successModal").style.display = "none";
        }, 1600);

        showAdminInventory();
      })
      .withFailureHandler(function(error) {
        alert("Error assigning equipment: " + error.message);

        if (assignButton) {
          assignButton.disabled = false;
          assignButton.textContent = "Assign";
          assignButton.style.opacity = "1";
          assignButton.style.cursor = "pointer";
        }

        console.error(error);
      })
      .assignSelectedAssetToUser(
        currentDirectAssignAsset,
        selectedDirectAssignUser.Name,
        selectedDirectAssignUser.Team
      );
  }

  let currentEditingAsset = null;

  function openEditAssetRequest(asset) {

    currentEditingAsset = asset;

    const modal = document.getElementById("editAssetModal");
    const content = document.getElementById("editAssetContent");

    content.innerHTML = `
      <label>Device</label>
      <input id="editAssetDevice"
        value="${asset.Device || ""}">

      <label style="margin-top:16px; display:block;">
        Brand
      </label>
      <input id="editAssetBrand"
        value="${asset.Brand || ""}">

      <label style="margin-top:16px; display:block;">
        Model
      </label>
      <input id="editAssetModel"
        value="${asset.Model || ""}">

      <label style="margin-top:16px; display:block;">
        Serial Number
      </label>
      <input id="editAssetSN"
        value="${asset.SN || ""}">

      <label style="margin-top:16px; display:block;">
        Internal SN
      </label>
      <input id="editAssetInternalSN"
        value="${asset["Internal SN"] || ""}">

      <label style="margin-top:16px; display:block;">
        Reason
      </label>

      <textarea
        id="editAssetReason"
        style="
          display:block;
          width:100%;
          height:90px;
          margin:8px 0 0 0;
          border:1px solid #d0d5dd;
          border-radius:10px;
          padding:12px;
          box-sizing:border-box;
          font-family:Arial, sans-serif;
          font-size:14px;
          line-height:1.4;
          color:#172033;
          background:#ffffff;
          resize:vertical;
          outline:none;
        "
        placeholder="Explain why this update is needed"></textarea>

      <div style="
        display:flex;
        justify-content:flex-end;
        gap:10px;
        margin-top:24px;
      ">

        <button
          type="button"
          class="button"
          style="background:#667085;"
          onclick="closeEditAssetModal()">
          Cancel
        </button>

        <button
          type="button"
          id="submitEditAssetButton"
          class="button"
          onclick="submitEditAssetRequest()">
          Submit Request
        </button>
      </div>
    `;

    modal.style.display = "flex";
  }

  function closeEditAssetModal() {
    document.getElementById("editAssetModal").style.display = "none";
    currentEditingAsset = null;
  }

  function submitEditAssetRequest() {
    console.log("submitEditAssetRequest called");

    if (!currentEditingAsset) {
      showWarningMessage(
        "No Asset Selected",
        "Please select an asset before continuing."
      );
      return;
    }

    const reasonInput = document.getElementById("editAssetReason");
    const submitButton = document.getElementById("submitEditAssetButton");

    if (!reasonInput) {
      showWarningMessage(
        "Unexpected Error",
        "The reason field could not be found."
      );
      return;
    }

    const reason = reasonInput.value.trim();

    if (!reason) {
      showWarningMessage(
        "Reason Required",
        "Please enter a reason before submitting your request."
      );
      return;
    }

    const updatedAsset = {
      Device: document.getElementById("editAssetDevice").value.trim(),
      Brand: document.getElementById("editAssetBrand").value.trim(),
      Model: document.getElementById("editAssetModel").value.trim(),
      SN: document.getElementById("editAssetSN").value.trim(),
      "Internal SN": document
        .getElementById("editAssetInternalSN")
        .value
        .trim()
    };

    const originalAsset = {
      Device: String(currentEditingAsset.Device || "").trim(),
      Brand: String(currentEditingAsset.Brand || "").trim(),
      Model: String(currentEditingAsset.Model || "").trim(),
      SN: String(currentEditingAsset.SN || "").trim(),
      "Internal SN": String(
        currentEditingAsset["Internal SN"] || ""
      ).trim()
    };

    const hasChanges =
      originalAsset.Device !== updatedAsset.Device ||
      originalAsset.Brand !== updatedAsset.Brand ||
      originalAsset.Model !== updatedAsset.Model ||
      originalAsset.SN !== updatedAsset.SN ||
      originalAsset["Internal SN"] !== updatedAsset["Internal SN"];

    if (!hasChanges) {
      showWarningMessage(
        "No changes detected",
        "Please modify at least one field before submitting the request."
      );
      return;
    }

    const request = {
      Request_type: "edit_equipment",
      Requested_by: currentUser.Email || "",
      Requested_name: currentUser.Name || "",
      Team: currentUser.Team || "",

      Device: currentEditingAsset.Device || "",
      Brand: currentEditingAsset.Brand || "",
      Model: currentEditingAsset.Model || "",
      SN: currentEditingAsset.SN || "",
      "Internal SN": currentEditingAsset["Internal SN"] || "",

      Quantity: 1,

      Comments: JSON.stringify({
        reason: reason,
        updated: updatedAsset
      })
    };

    console.log("Request to send:", request);

    if (submitButton) {
      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";
      submitButton.style.opacity = "0.6";
      submitButton.style.cursor = "not-allowed";
    }

    google.script.run
      .withSuccessHandler(function(response) {
        console.log("Request created:", response);

        closeEditAssetModal();
        clearCache();

        const successModal = document.getElementById("successModal");

        if (successModal) {
          successModal.style.display = "flex";

          setTimeout(function() {
            successModal.style.display = "none";
          }, 1600);
        }
      })
      .withFailureHandler(function(error) {
        const message =
          error && error.message
            ? error.message
            : String(error);

        alert("Error submitting request: " + message);
        console.error("createRequest failed:", error);

        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = "Submit Request";
          submitButton.style.opacity = "1";
          submitButton.style.cursor = "pointer";
        }
      })
      .createRequest(request);
  }

  function showWarningMessage(title, message) {
    let modal = document.getElementById("warningModal");

    if (!modal) {
      modal = document.createElement("div");
      modal.id = "warningModal";
      modal.className = "notification-overlay";

      modal.innerHTML = `
        <div class="notification-box">
          <div class="notification-icon" style="
            background:#FEF3C7;
            color:#D97706;
          ">
            !
          </div>

          <div class="notification-title" id="warningModalTitle"></div>

          <div class="notification-text" id="warningModalText"></div>

          <button
            class="button"
            style="margin-top:20px;"
            onclick="closeWarningMessage()">
            OK
          </button>
        </div>
      `;

      document.body.appendChild(modal);
    }

    document.getElementById("warningModalTitle").textContent = title;
    document.getElementById("warningModalText").textContent = message;

    modal.style.display = "flex";
  }

  function closeWarningMessage() {
    const modal = document.getElementById("warningModal");

    if (modal) {
      modal.style.display = "none";
    }
  }
</script>
