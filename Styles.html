<style>
  :root {
    --primary: #1e5bbb;
    --primary-dark: #174a98;
    --primary-soft: #edf4ff;

    --background: #f6f8fc;
    --surface: #ffffff;
    --surface-soft: #f9fbff;

    --text: #13294b;
    --text-soft: #667085;
    --border: #e4eaf2;

    --success: #15803d;
    --danger: #d92d20;
    --warning: #d97706;

    --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);

    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
  }

  * {box-sizing: border-box;}
  body{margin: 0; font-family: Inter, Arial, sans-serif; background: var(--background); color: var(--text); }
  .login-page{min-height: 100vh; max-width: none; margin: 0; padding: 32px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #071a3d 0%, #0b2f67 50%, #0f4d92 100% ); }
  .login-card{width: min(100%, 440px); padding: 42px; background: rgba(255, 255, 255, 0.96); border: 1px solid rgba(255, 255, 255, 0.65); border-radius: 24px; box-shadow: 0 28px 70px rgba(0, 0, 0, 0.28); backdrop-filter: blur(10px); }
  .login-logo{display:flex; justify-content:center; align-items:center; padding-top:10px; margin-bottom:25px; }
  .login-logo img{width:120px; height:auto; display:block; }
  .login-title{margin: 0; color: var(--text); font-size: 34px; line-height: 1.15; letter-spacing: -0.03em; }
  .login-subtitle{margin: 12px 0 28px; color: var(--text-soft); font-size: 15px; }
  .login-card input{margin: 0; height: 52px; padding: 0 16px; border-radius: 12px; font-size: 15px; }
  .login-button{width: 100%; margin-top: 16px; height: 52px; border-radius: 12px; font-size: 15px; font-weight: 700; }
  #loginMessage{margin: 14px 0 0; min-height: 20px; color: var(--danger); font-size: 13px; text-align: center; }
  .app{display: none; min-height: 100vh; }
  .sidebar{width: 260px; background: linear-gradient(180deg, #D3DAEC 20%, #f7faff 100%); color: var(--text); padding: 28px 18px; position: fixed; top: 0; left: 0; bottom: 0; border-right: 1px solid var(--border); box-shadow: 8px 0 30px rgba(15, 23, 42, 0.06); }
  .sidebar::after{ content: ""; position: absolute; top: 0; right: 0; width: 3px; height: 100%; background: #2563eb; opacity: 0.15; pointer-events: none; }
  .logo{font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 50px; letter-spacing: -0.02em; }
  .menu-title{font-size: 11px; color: #8a94a6; margin: 26px 10px 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .menu-item{padding: 12px 14px; border-radius: var(--radius-sm); margin-bottom: 6px; cursor: pointer; color: #344054; font-weight: 600; transition: all 0.18s ease; }
  .menu-item:hover{background: #f0f5ff; color: var(--primary); transform: translateX(2px); }
  .menu-item.active{background: var(--primary); color: white; box-shadow: 0 6px 16px rgba(30, 91, 187, 0.22); }
  .main{margin-left: 260px; padding: 38px 42px; }
  .header{display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
  .header h1{margin: 0; font-size: 32px; line-height: 1.2; letter-spacing: -0.02em; color: var(--text); }
  .header p, p{color: var(--text-soft); }
  .card{background: var(--surface); border-radius: var(--radius-lg); padding: 26px; box-shadow: var(--shadow-sm); border: 1px solid rgba(228, 234, 242, 0.9); margin-top: 24px; overflow-x: auto; }
  .button{background: var(--primary); color: white; border: none; border-radius: var(--radius-sm); padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.18s ease; }
  .button:hover{background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(30, 91, 187, 0.2); }
  input, select, textarea{width: 100%; padding: 12px 14px; margin-top: 18px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; box-sizing: border-box; background: white; color: var(--text); transition: border-color 0.18s ease, box-shadow 0.18s ease; }
  input:focus, select:focus, textarea:focus{outline: none; border-color: #8bb4f0; box-shadow: 0 0 0 4px rgba(30, 91, 187, 0.08); }
  table{width: 100%; border-collapse: collapse; margin-top: 18px; min-width: 900px; }
  th{background: #eef4ff; text-align: left; padding: 13px 12px; font-size: 12px; color: #344054; font-weight: 700; text-transform: none; }
  td{padding: 14px 12px; border-top: 1px solid #edf0f4; font-size: 14px; color: #475467; }
  tbody tr{transition: background 0.15s ease; }
  tbody tr:hover{background: #fafcff; }
  .badge{padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: bold; display: inline-block; }
  .available{background: #dcfce7; color: #166534; }
  .assigned{background: #dbeafe; color: #1e40af; }
  .empty{color: var(--text-soft); padding: 20px 0; }
  .user-info{color: var(--text-soft); font-size: 14px; }
  .notification-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:9999; justify-content:center; align-items:center; }
  .notification-box{ width:360px; background:#fff; border-radius:18px; padding:28px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.18); }
  .notification-icon{ width:72px; height:72px; border-radius:50%; background:#dcfce7; color:#15803d; font-size:42px; display:flex; align-items:center;              justify-content:center;  margin:0 auto 18px; }
  .notification-title{ font-size:22px; font-weight:bold; margin-bottom:10px; }      
  .notification-text{ color:#667085; }
  .action-buttons{display:flex; gap:8px; }
  .icon-btn{width:36px; height:36px; border:none; border-radius:10px; cursor:pointer; font-size:18px; font-weight:bold; transition:.2s; }
  .icon-btn:hover{transform:scale(1.08); }
  .btn-approve{background:#DCFCE7; color:#15803D; }
  .btn-reject{background:#FEE2E2; color:#DC2626; }
  .btn-assign{background:#FEF3C7; color:#D97706; }
  .assign-overlay{display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35); z-index: 2500; justify-content: center; align-items: center; }
  .assign-box{width: 520px; max-width: calc(100% - 40px); background: white; border-radius: 18px; padding: 28px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18); }
  .assign-header{display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .assign-title{font-size: 22px; font-weight: bold; }
  .assign-close{border: none; background: #f1f5f9; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 18px; }
  .assign-count{background: #fef3c7; color: #92400e; border-radius: 999px; padding: 7px 12px; display: inline-block; font-weight: bold; margin-bottom: 16px; }
  .available-assets-list{ display: flex; flex-direction: column; gap: 10px; margin-top: 16px; max-height: 280px; overflow-y: auto; }
  .available-asset-option{display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; }
  .available-asset-option:hover{background: #f8fafc; }
  .available-asset-option input{width: auto; margin: 3px 0 0; }
  .request-tabs{display: flex; gap: 10px; margin-bottom: 22px; border-bottom: 1px solid #e5e7eb; }
  .request-tab{background: transparent; color: #667085; border: none; border-bottom: 3px solid transparent; padding: 12px 16px; font-size: 15px; font-weight: bold;  cursor: pointer; }
  .request-tab:hover{color: #2563eb; }
  .request-tab.active{color: #2563eb; border-bottom-color: #2563eb; }
  .tab-count{display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; margin-left:8px; padding:0 8px; border-radius:999px; background:#EEF4FF; color:#2563EB; font-size:12px; font-weight:700; }
  .request-tab.active .tab-count{background:#DBEAFE; }
  .btn-view{background: #dbeafe; color: #2563eb; }
  .inventory-summary{display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-top: 18px; }
  .summary-card{background: #ffffff; border: 1px solid #e8ecf2; border-radius: 16px; padding: 18px; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04); }
  .summary-device{font-size: 14px; color: #667085; margin-bottom: 8px; }
  .summary-total{font-size: 30px; font-weight: 700; color: #172033; line-height: 1; }
  .summary-available{font-size: 13px; color: #15803d; margin-top: 8px; }
  .team-members-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; margin-top:24px; align-items:start; }
  @media (max-width:1400px){.team-members-grid{grid-template-columns:repeat(2,1fr); } }
  @media (max-width:900px){.team-members-grid{grid-template-columns:1fr; } }
  .team-member-card{background:#fff; border:1px solid var(--border); border-radius:22px; padding:26px; box-shadow:var(--shadow-sm); transition:.25s; position:relative; }
  .team-member-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-md); }
  .team-member-header{display: flex; align-items: center; gap: 14px; padding-bottom: 16px; border-bottom: 1px solid #eef1f5; }
  .team-member-avatar{width: 48px; height: 48px; border-radius: 50%; background: #dbeafe; color: #2563eb; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0; }
  .team-member-name{font-size: 17px; font-weight: 700; color: #172033; }
  .team-member-email{margin-top: 3px; color: #667085; font-size: 13px; }
  .team-member-stats{display: flex; gap: 10px; margin-top: 16px; }
  .team-stat{flex: 1; background: #f8fafc; border-radius: 12px; padding: 12px; }
  .team-stat-number{font-size: 22px; font-weight: 700; color: #172033; }
  .team-stat-label{margin-top: 3px; color: #667085; font-size: 12px; }
  .team-card-section{margin-top: 18px; }
  .team-card-section-title{margin-bottom: 10px; font-size: 13px; font-weight: 700; color: #344054; text-transform: uppercase; letter-spacing: 0.04em; }
  .team-item-list{display: flex; flex-direction: column; gap: 8px; }
  .team-list-item{background: #f8fafc; border: 1px solid #eef1f5; border-radius: 10px; padding: 10px 12px; }
  .team-item-title{font-size: 14px; font-weight: 600; color: #172033; }
  .team-item-meta{margin-top: 3px; font-size: 12px; color: #667085; }
  .team-empty-text{color: #98a2b3; font-size: 13px; }
  .team-member-actions{display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .team-action-button{background: #f1f5f9; color: #2563eb; border: 1px solid #dbe3ef; border-radius: 10px; padding: 11px 12px; font-size: 13px; font-weight: 600;cursor: pointer; }
  .team-action-button:hover{background: #e8f0ff; }
  .inventory-main-stats{display: grid; grid-template-columns: repeat(3, minmax(160px, 1fr)); gap: 16px; margin-top: 18px; }
  .inventory-main-stat{background: #f8fafc; border: 1px solid #e7ebf2; border-radius: 16px; padding: 20px; }
  .inventory-main-number{font-size: 34px; font-weight: 700; color: #172033; }
  .inventory-main-label{margin-top: 6px; font-size: 13px; font-weight: 600; color: #667085; }
  .inventory-device-grid{display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; margin-top: 18px; }
  .device-summary-card{background: #ffffff; border: 1px solid #e7ebf2; border-radius: 14px; padding: 13px 14px; min-height: 108px; text-align: left; cursor: pointer;transition: all .2s ease; }
  .device-summary-name{display: flex; align-items: center; gap: 6px; color: #475467; font-size: 13px; font-weight: 600; line-height: 1.2; }
  .device-summary-total{margin-top: 10px; font-size: 25px; font-weight: 700; line-height: 1; color: #172033; }
  .device-summary-label{display: inline; margin-left: 4px; font-size: 11px; color: #98a2b3; }
  .device-summary-available{margin-top: 7px; font-size: 12px; font-weight: 600; color: #15803d; }
  .assign-user-button{width:38px; height:38px; border:1px solid transparent; border-radius:10px; background:#eef4ff; color:#2563eb; font-size:18px; font-weight:700; cursor:pointer; transition: background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease; }
  .assign-user-button:hover{background:#dbeafe; color:#1d4ed8; transform:scale(1.05); }
  .assign-user-button:focus{outline:none; background:#eef4ff; color:#2563eb; border-color:#93c5fd; box-shadow:0 0 0 3px rgba(37,99,235,.16); }
  .assign-user-button:active{ background:#bfdbfe; color:#1d4ed8; transform:scale(.98); }
  .assign-user-row{padding:12px; margin-top:8px; border:1px solid #E4E7EC; border-radius:10px; cursor:pointer; transition:.2s; }
  .assign-user-row:hover{background:#EEF4FF; border-color:#2563EB; }
  .user-card-actions{position:absolute; top:14px; right:14px; display:flex; align-items:center; gap:12px; }
  .user-card-icon-btn{width:42px; height:42px; padding:0; display:flex; align-items:center; justify-content:center; border:none; border-radius:12px; cursor:pointer; flex-shrink:0; transition:.2s; }
  .user-card-icon-btn:hover{transform: scale(1.08); }
  .user-card-icon-btn svg{width:20px; height:20px; display:block; }
  .edit-user-icon{background:#EEF4FF; color:#2563EB; }
  .edit-user-icon:hover{background: #dbeafe; }
  .edit-asset-icon{background:#EEF4FF; color:#2563EB; }
  .edit-asset-icon:hover{background:#DBEAFE; color:#1D4ED8; }
  .edit-asset-icon svg{stroke:currentColor !important; fill:none !important; }
  .edit-asset-icon svg path{stroke:currentColor !important; fill:none !important; }
  .delete-user-icon{background:#FEF2F2; color:#DC2626;  }
  .delete-user-icon:hover{background:#FEE2E2; color:#B91C1C; }
  .delete-user-icon svg{stroke:#DC2626 !important;  fill:none !important; }
  .delete-user-icon svg path{stroke:#DC2626 !important; fill:none !important; }
  .request-filters{display: grid; grid-template-columns: minmax(320px, 2fr) minmax(170px, 0.7fr) minmax(170px, 0.7fr); gap: 14px; margin: 24px 0 18px; align-items: center; }
  .request-filters input,.request-filters select{margin: 0; height: 48px; }
  .request-search-wrapper{position: relative; }
  .request-search-wrapper input{padding-left: 44px; }
  .request-search-icon{position: absolute; top: 50%; left: 14px; width: 19px; height: 19px; color: #8a94a6; transform: translateY(-50%); pointer-events: none; }
  .request-type-badge, .request-status-badge{padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; display:inline-block; white-space:nowrap; }
  .request-status-pending{background:#FEF3C7; color:#92400E; }
  .request-status-approved{background:#DCFCE7; color:#166534; }
  .request-status-rejected{background:#FEE2E2; color:#B91C1C; }
  .request-type-request_equipment{background:#DBEAFE; color:#1D4ED8; }
  .request-type-register_equipment{background:#EDE9FE; color:#6D28D9; }
  .request-type-damaged_equipment{background:#FEE2E2; color:#B91C1C; }
  .request-type-return_equipment{background:#FFEDD5; color:#C2410C; }
  .request-results-count{margin:4px 0 14px; color:#667085; font-size:13px; font-weight:600; }
  .request-type-edit_equipment{background:#E0F2FE; color:#0369A1; }
  .inventory-page{display: flex; flex-direction: column; gap: 24px; }
  .quick-actions-section, .equipment-section{background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
  .quick-actions-section{padding: 26px; }
  .equipment-section{padding: 26px; overflow-x: auto; }
  .section-title{margin: 0; color: var(--text); font-size: 22px; line-height: 1.2; letter-spacing: -0.02em; }
  .quick-actions-grid{display: grid; grid-template-columns: repeat(4, minmax(190px, 1fr)); gap: 16px; margin-top: 20px; }
  .quick-action-card{min-height: 155px; padding: 20px 18px; border: 1px solid var(--border); border-radius: 16px; background: #ffffff; color: var(--text); text-align: center; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center;
  transition:
    transform 0.18s ease,
    border-color 0.18s ease,
    box-shadow 0.18s ease,
    background 0.18s ease;
  }
  .quick-action-card:hover{transform: translateY(-3px); border-color: #aac6ee; background: #fbfdff; box-shadow: 0 12px 24px rgba(30, 91, 187, 0.1); }
  .quick-action-card:focus-visible{outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30, 91, 187, 0.1); }
  .quick-action-icon{width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .icon-request{background:#EDF4FF; color:#2563EB; }
  .icon-register{background:#ECFDF3; color:#16A34A; }
  .icon-damage{background:#FFF7ED; color:#EA580C; }
  .icon-return{background:#F5F3FF; color:#7C3AED; }
  .quick-action-icon svg{width:30px; height:30px; }
  .quick-action-icon svg{stroke:currentColor; }
  .quick-action-content{margin-top: 12px; }
  .quick-action-title{color: var(--text); font-size: 15px; font-weight: 700; line-height: 1.3; }
  .quick-action-description{margin-top: 6px; color: var(--text-soft); font-size: 13px; font-weight: 400; line-height: 1.4; }
  .equipment-section-header{display: flex; justify-content: space-between; align-items: center; }
  .equipment-search-wrapper{position: relative; width: min(100%, 620px); margin-top: 20px; }
  .equipment-search-icon{position: absolute; top: 50%; left: 14px; width: 19px; height: 19px; color: #8a94a6; transform: translateY(-50%); pointer-events: none; }
  .equipment-search-input{margin: 0; padding-left: 44px; background: #ffffff; }
  .equipment-section table{margin-top: 22px; }
  @media (max-width: 1200px){.quick-actions-grid {grid-template-columns: repeat(2, minmax(210px, 1fr)); } }
  .requests-page{display: flex; flex-direction: column; gap: 22px; padding-bottom: 24px; }
  .requests-controls-card, .requests-table-card{background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
  .requests-controls-card{padding: 22px 26px; }
  .requests-table-card{padding: 8px 26px 26px; overflow-x: auto; }
  .requests-controls-card .request-tabs{margin: 0; }
  .requests-search-wrapper{width: min(100%, 520px); margin-top: 20px; }
  .requests-table-card table{margin-top: 18px; background: #ffffff; }
  .requests-table-card tbody tr{background: #ffffff; } 
  .requests-table-card .empty{margin: 0; padding: 24px 0; }
  .inventory-back-button{display: inline-flex; align-items: center; padding: 0; margin: 0 0 14px; border: none; background: transparent; color: var(--primary);font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: color 0.18s ease, transform 0.18s ease; }
  .inventory-back-button:hover{color: var(--primary-dark); transform: translateX(-2px); }
  .inventory-detail-title{margin-top: 0; }
  #inventorySummary{display: flex; flex-direction: column; gap: 28px; }
  .inventory-main-stats{display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 18px; margin: 0; }
  .inventory-main-stat{position: relative; overflow: hidden; min-height: 122px; padding: 24px; background: #ffffff; border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05); }
  .inventory-main-stat::before{content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--primary); }
  .inventory-main-stat:nth-child(2)::before{background: #16a34a; }
  .inventory-main-stat:nth-child(3)::before{background: #dc2626; }
  .inventory-main-number{font-size: 38px; font-weight: 800; line-height: 1; color: var(--text); letter-spacing: -0.03em; }
  .inventory-main-label{margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--text-soft); }
  .inventory-kpi-bar{display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); align-items: stretch; background: #ffffff; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .inventory-kpi-card{position: relative; display: flex; align-items: center; gap: 18px; min-height: 130px; padding: 24px 28px; border: none; border-right: 1px solid var(--border); background: #ffffff; color: var(--text); text-align: left; font-family: inherit; cursor: pointer; transition: background 0.18s ease, transform 0.18s ease; }
  .inventory-kpi-card:last-child{border-right: none; }
  .inventory-kpi-card:hover{background: #fbfdff; }
  .inventory-kpi-icon{width: 72px; height: 72px; border-radius: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .inventory-kpi-icon svg{width: 38px; height: 38px; fill: none !important; stroke: currentColor !important; }
  .inventory-kpi-icon svg path,.inventory-kpi-icon svg circle,.inventory-kpi-icon svg polygon,.inventory-kpi-icon svg rect{fill: none !important; stroke: currentColor !important; }
  .inventory-kpi-content{min-width: 0; }
  .inventory-kpi-number{font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
  .inventory-kpi-label{margin-top: 8px; font-size: 15px; font-weight: 700; color: #475467; }
  .inventory-kpi-description{margin-top: 5px; font-size: 13px; color: var(--text-soft); }
  .inventory-kpi-total .inventory-kpi-icon{background: #edf4ff; color: #2563eb; }
  .inventory-kpi-available .inventory-kpi-icon{background: #ecfdf3; color: #16a34a; }
  .inventory-kpi-damaged .inventory-kpi-icon{background: #fef2f2; color: #dc2626; }
  .inventory-kpi-total .inventory-kpi-number{color: var(--text); }
  .inventory-kpi-available .inventory-kpi-number{color: #15803d; }
  .inventory-kpi-damaged .inventory-kpi-number{color: #b91c1c;  }
